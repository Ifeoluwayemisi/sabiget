services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sabiget
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sabiget"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sabiget?schema=public
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      # Development-only secrets. Production must inject real values.
      - JWT_ACCESS_SECRET=dev-only-access-secret-change-me
      - JWT_REFRESH_SECRET=dev-only-refresh-secret-change-me

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time. The browser resolves
        # localhost, not the Docker-internal "backend" hostname.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    env_file:
      - frontend/.env

volumes:
  db-data:
    driver: local
