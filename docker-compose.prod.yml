services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sabiget
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    # Do not expose DB to host in production by default

  redis:
    image: redis:7

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - backend/.env
    command: ["sh", "-c", "npx prisma migrate deploy"]
    depends_on:
      - db
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: sabiget-backend:prod
    env_file:
      - backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
      - migrate

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: sabiget-frontend:prod
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-prod-data:
    driver: local
